@if (menuOpen()) {
  <div class="mobile-menu-overlay" (click)="closeMenu()"></div>
  <div class="mobile-menu">
    <a routerLink="/last-played" routerLinkActive="active" (click)="closeMenu()">Last Played</a>
    <a routerLink="/today" routerLinkActive="active" (click)="closeMenu()">Today</a>
    <a routerLink="/schedule" routerLinkActive="active" (click)="closeMenu()">Schedule</a>
    <a routerLink="/news" routerLinkActive="active" (click)="closeMenu()">News</a>
    <a class="settings-link" routerLink="/settings" routerLinkActive="active" (click)="closeMenu()">
      <svg class="gear-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

<main class="main-content">
  <router-outlet />
</main>
